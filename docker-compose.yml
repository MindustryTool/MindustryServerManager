services:
  server-manager:
    image: ghcr.io/mindustrytool/mindustry-server-manager:latest
    container_name: server-manager
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json
      - /home/ubuntu/.docker/config.json:/root/.docker/config.json:ro
      - /home/ubuntu/data/mindustry-servers:/home/ubuntu/data/mindustry-servers
    ports:
      - "8088:8088"
    env_file: ./config/.env
    networks:
      - server-manager
      - mindustry-server

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json
    env_file: ./config/.env

  llama-translator:
    image: ghcr.io/mindustrytool/llama-translator:latest
    container_name: llama-translator
    restart: unless-stopped
    labels:
        - "com.centurylinklabs.watchtower.enable=true"
    volumes:
        - ./data/models:/models
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 500M
    networks:
        - server-manager

networks:
  mindustry-server:
    driver: bridge
    name: mindustry-server

  server-manager:
    driver: bridge

